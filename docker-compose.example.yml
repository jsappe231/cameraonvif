services:
  camera-smtp-unifi-protect-bridge:
    build: .
    container_name: camera-smtp-unifi-protect-bridge
    restart: unless-stopped
    ports:
      # Point the camera's SMTP server at this host and port.
      - "8025:8025"
    environment:
      SMTP_HOST: "0.0.0.0"
      SMTP_PORT: "8025"
      # Set both values when the camera is configured to use SMTP AUTH LOGIN/PLAIN.
      SMTP_USERNAME: "camera"
      SMTP_PASSWORD: "replace-with-camera-smtp-password"

      # A real inbound URL from automation connected to Protect. Do not point this
      # at the UniFi console: Protect has no generic /protect-event endpoint.
      UNIFI_PROTECT_EVENT_URL: "https://automation.example.local/hooks/camera-event"
      UNIFI_PROTECT_API_KEY: "replace-with-automation-api-key"
      # Optional Protect camera identifier included in every event.
      UNIFI_PROTECT_CAMERA_ID: ""

      MATCH_SUBJECT_PATTERNS: "intrusion,line crossing,human,vehicle,person,alarm"
      MATCH_BODY_PATTERNS: ""
      IGNORE_SUBJECT_PATTERNS: "test email,smtp test"
      COOLDOWN_SECONDS: "20"
      VERIFY_TLS: "true"
