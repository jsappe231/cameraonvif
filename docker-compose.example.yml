services:
  camera-smtp-unifi-protect-bridge:
    build: .
    container_name: camera-smtp-unifi-protect-bridge
    restart: unless-stopped
    ports:
      # Point the camera's SMTP server at this host and port.
      - "8025:8025"
    environment:
      SMTP_HOST: "0.0.0.0"
      SMTP_PORT: "8025"

      # An inbound URL supplied by your Protect version or Protect automation.
      UNIFI_PROTECT_EVENT_URL: "https://unifi-console.example.local/protect-event"
      UNIFI_PROTECT_API_KEY: "replace-with-protect-api-key"
      # Optional Protect camera identifier included in every event.
      UNIFI_PROTECT_CAMERA_ID: ""

      MATCH_SUBJECT_PATTERNS: "intrusion,line crossing,human,vehicle,person,alarm"
      MATCH_BODY_PATTERNS: ""
      IGNORE_SUBJECT_PATTERNS: "test email"
      COOLDOWN_SECONDS: "20"
      VERIFY_TLS: "true"
